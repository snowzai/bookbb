<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>書比比 BookBB</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="compare.css">
<script type="module" src="compare.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
      </span>
      <div>
        <div class="brand-name">書比比 <span class="brand-en">BookBB</span></div>
        <div class="brand-sub">一次比較多家網路書店的售價</div>
      </div>
    </div>
    <form id="form" class="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋書名、作者或 ISBN" autocomplete="off" autofocus>
      <button type="submit">查詢</button>
    </form>
    <div id="filters" class="segmented" role="radiogroup" aria-label="版本">
      <label><input type="radio" name="format" value="all" checked><span>全部</span></label>
      <label><input type="radio" name="format" value="紙本"><span>紙本</span></label>
      <label><input type="radio" name="format" value="電子書"><span>電子書</span></label>
    </div>
    <button id="savedBtn" class="saved-btn" type="button" aria-expanded="false" aria-controls="drawer">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      已保存<span id="savedCount" class="badge"></span>
    </button>
  </div>
</header>
<main>
  <section id="summary"></section>
  <section id="columns"></section>
</main>
<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" aria-label="已保存" hidden>
  <div class="drawer-head">
    <div class="drawer-tabs" role="tablist">
      <button type="button" role="tab" data-tab="queries" aria-selected="true">查詢<span id="queryCount" class="badge"></span></button>
      <button type="button" role="tab" data-tab="favs" aria-selected="false">收藏<span id="favCount" class="badge"></span></button>
    </div>
    <button id="drawerClose" class="icon-btn" type="button" title="關閉" aria-label="關閉">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
  <div id="drawerFoot" class="drawer-foot"></div>
</aside>
</body>
</html>
